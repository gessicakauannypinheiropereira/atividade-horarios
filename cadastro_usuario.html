<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro usuario</title>
</head>
<body>

    <h1 align="center">Cadastre-se</h1>

    <form action="index.html">

        <label>Nome Completo:</label><br>
        <input type="text" name="nome"><br><br>

        <label>Endereço Completo:</label><br>
        <textarea name="endereco"></textarea><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email"><br><br>

        <label>Login:</label><br>
        <input type="text" name="login"><br><br>

        <label>Senha:</label><br>
        <input type="password" name="senha"><br><br>

        <label>Confirmação de Senha:</label><br>
        <input type="password" name="confirmar_senha"><br><br>

        <button type="submit">Cadastrar</button>

        <button type="reset">Limpar</button>

    </form>

    <br>

    <a href="index.html">Voltar para Login</a>

</body>
</html>
